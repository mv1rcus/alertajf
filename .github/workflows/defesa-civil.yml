name: Alertas da Defesa Civil (JF)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: defesa-civil
  cancel-in-progress: true
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/defesa_civil.py
      - name: Commit se mudou
        run: |
          if [ -n "$(git status --porcelain public/defesa-civil.json)" ]; then
            git config user.name "mvthebest"
            git config user.email "68456420+mvthebest@users.noreply.github.com"
            git add public/defesa-civil.json
            git commit -m "dados: alerta Defesa Civil JF"
            # main pode receber um merge enquanto a coleta roda.
            # Integra os commits remotos sem reescrever o histórico.
            for tentativa in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$tentativa" = 3 ]; then
                echo "Falha ao publicar após 3 tentativas; dados anteriores preservados."
                exit 1
              fi
              sleep 2
            done
          fi
