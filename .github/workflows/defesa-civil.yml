name: Alertas da Defesa Civil (JF)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: defesa-civil
  cancel-in-progress: true
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Código (script) vem de main; os dados vivem na branch "dados",
      # fora de main, para que cada atualização não vire deploy na Vercel.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: dados
          path: dados
      - name: Coleta
        run: |
          cp dados/defesa-civil.json public/defesa-civil.json
          python3 scripts/defesa_civil.py
      - name: Publica na branch dados (1 commit só, histórico não cresce)
        run: |
          if ! cmp -s public/defesa-civil.json dados/defesa-civil.json; then
            cp public/defesa-civil.json dados/defesa-civil.json
            cd dados
            git config user.name "mvthebest"
            git config user.email "68456420+mvthebest@users.noreply.github.com"
            git checkout --orphan nova
            git add -A
            git commit -m "dados: alerta Defesa Civil JF"
            for tentativa in 1 2 3; do
              if git push --force origin nova:dados; then exit 0; fi
              sleep 2
            done
            echo "Falha ao publicar; dados anteriores preservados."
            exit 1
          fi
